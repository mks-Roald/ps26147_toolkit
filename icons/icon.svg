<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sigGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect width="600" height="600" rx="132" ry="132" fill="url(#sigGradient)"/>

  <!-- Centered RF Signal Pulse Waveform -->
  <g transform="translate(300, 300) scale(20) translate(-12, -12)">
    <path d="M2 12h4l3-9 6 18 3-9h4" 
          stroke="#FFFFFF" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"
          filter="url(#waveGlow)"/>
  </g>
</svg>