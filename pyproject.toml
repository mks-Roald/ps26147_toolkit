[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps26147_toolkit"
version = "0.1.0"
description = "Automated .IQ and .wav analysis + signal parameter extraction toolkit for SIH 2026 PS26147"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.13.1",
    "matplotlib",
    "pandas",
    "scikit-learn==1.4.2",
    "torch",
    "torchvision",
    "librosa",
    "soundfile",
    "tqdm",
    "uv",
    "streamlit",
    "plotly",
    "joblib==1.4.2",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "websockets",
]

[project.scripts]
ps26147 = "ps26147_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ps26147_toolkit", "web_demo"]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = ["regression: end-to-end API, simulator, storage, and pipeline regressions"]


