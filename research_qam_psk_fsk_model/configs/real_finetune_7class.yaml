stage: real_finetune
init_checkpoint: research_qam_psk_fsk_model/results/synthetic_pretrain/seed_42/best.pt
repository_version: "synthetic_pretrain_seed_42; record repository commit before launch"

data:
  dataset_root: "C:/Users/amity/Desktop/ps26147_toolkit/data"
  train_manifest: ""
  validation_manifest: ""
  synthetic_pretraining_dataset_root: "C:/Users/amity/Desktop/ps26147_toolkit/data_synthetic_25k"
  synthetic_pretraining_train_manifest: "research_qam_psk_fsk_model/data/synthetic_train_manifest.json"
  synthetic_pretraining_validation_manifest: "research_qam_psk_fsk_model/data/synthetic_val_manifest.json"
  real_finetuning_dataset_root: "C:/Users/amity/Desktop/ps26147_toolkit/data"
  real_finetuning_train_manifest: "data_splits_realistic_7class/data_7class_ec8746df76/train.json"
  real_finetuning_validation_manifest: "data_splits_realistic_7class/data_7class_ec8746df76/val.json"
  input_length: 4096
  iq_fallback_sample_rate_hz: null
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

architecture:
  num_classes: 7
  feature_count: 22
  iq_embedding_dim: 128
  auxiliary_embedding_dim: 64
  fused_embedding_dim: 128
  psd_bins: 2048
  dropout: 0.25

training:
  seed: 42
  optimizer: AdamW
  learning_rate: 0.00003
  weight_decay: 0.0001
  batch_size: 16
  gradient_accumulation_steps: 1
  max_epochs: 40
  early_stopping_patience: 8
  focal_gamma: 2.0
  low_snr_qam_weight: 0.25
  amp: true
  phase_rotation_augmentation: true
  model_selection_priority: [macro_f1, recall_64QAM, accuracy]
  output_dir: research_qam_psk_fsk_model/results
  gradient_clip_norm: 5.0
  profile_timings: true
  gpu_utilization_logging: true

transfer:
  # Reuse the source checkpoint's TRAIN-only transforms for an input-coordinate-stable transfer start.
  scaler_policy: pretrained_checkpoint
  encoder_freeze_epochs: 4
  selective_unfreeze_epoch: 5
  selective_unfreeze_modules:
    - iq_encoder.features.7
    - iq_encoder.features.8
    - polar_encoder.features.4
    - polar_encoder.projection
    - psk_encoder.features.4
    - psk_encoder.projection
    - if_encoder.features.4
    - if_encoder.projection
    - psd_encoder.features.4
    - psd_encoder.projection
    - feature_encoder.mlp.2
    - feature_encoder.projection
  encoder_learning_rate: 0.00001
  fusion_head_learning_rate: 0.00003
