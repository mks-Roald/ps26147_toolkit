stage: synthetic_pretrain
init_checkpoint: ""
repository_version: "record git commit or dataset release before a future run"

data:
  # Leave empty until the externally generated GNU Radio dataset is ready.
  dataset_root: ""
  train_manifest: ""
  validation_manifest: ""
  # Stage 1: file-reference manifests; the IQ data remains in its source tree.
  synthetic_pretraining_dataset_root: "C:/Users/amity/Desktop/ps26147_toolkit/data_synthetic_25k"
  synthetic_pretraining_train_manifest: "research_qam_psk_fsk_model/data/synthetic_train_manifest.json"
  synthetic_pretraining_validation_manifest: "research_qam_psk_fsk_model/data/synthetic_val_manifest.json"
  # Optional future stage-2 real data.
  real_finetuning_dataset_root: ""
  real_finetuning_train_manifest: ""
  real_finetuning_validation_manifest: ""
  input_length: 4096
  # IQ captures without sample-rate metadata require an explicit fallback.
  iq_fallback_sample_rate_hz: null
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true

architecture:
  num_classes: 7
  feature_count: 22
  iq_embedding_dim: 128
  auxiliary_embedding_dim: 64
  fused_embedding_dim: 128
  psd_bins: 2048
  dropout: 0.25

training:
  seed: 42
  optimizer: AdamW
  learning_rate: 0.0005
  weight_decay: 0.0001
  batch_size: 16
  gradient_accumulation_steps: 1
  max_epochs: 40
  early_stopping_patience: 8
  focal_gamma: 2.0
  low_snr_qam_weight: 0.25
  amp: true
  phase_rotation_augmentation: true
  model_selection_priority: [macro_f1, recall_64QAM, accuracy]
  output_dir: research_qam_psk_fsk_model/results
  gradient_clip_norm: 5.0
  profile_timings: true
  gpu_utilization_logging: true

transfer:
  scaler_policy: fit_train
  encoder_freeze_epochs: 0
  selective_unfreeze_epoch: null
  selective_unfreeze_modules: []
  encoder_learning_rate: null
  fusion_head_learning_rate: null
